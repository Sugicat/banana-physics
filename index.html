<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Banana Tower</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/matter-js@0.19.0/build/matter.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/lil-gui@0.19.1/dist/lil-gui.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/alertifyjs@1.13.1/build/alertify.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/poly-decomp@0.3.0/build/decomp.min.js"></script>
</head>

<body>
    <div id="ui-layer">
        <div id="score-display">Height: 0.00m</div>
        <div id="stability-indicator">Verifying...</div>
        <div id="game-over-screen">
            <div class="title">GAME OVER</div>
            <div class="final-score" id="final-score">Height: 0.00m</div>
            <button class="btn" id="restart-btn">Try Again</button>
        </div>
    </div>
    <script src="main.js"></script>
</body>

</html>
